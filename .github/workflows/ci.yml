name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version (go.mod) and the two latest releases.
        go: ['1.24', oldstable, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test -race ./...
      # On oldstable: new staticcheck releases trail new Go releases, and
      # fail to read the standard library of a Go they do not support yet.
      - name: staticcheck
        if: matrix.go == 'oldstable'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
